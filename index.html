<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <!-- Site Icon / Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" href="assets/likex-favicon.png" />

  <link rel="shortcut icon" href="favicon.ico" />

  <!-- OpenGraph Meta for WhatsApp & Social Sharing -->

  <meta property="og:description" content="Instant automated social media marketing services at wholesale prices. 5,800+ live services." />
  <meta property="og:image" content="assets/likex-logo-tight.png" />
  <meta property="og:url" content="https://likex.in" />

  <!-- Cache Prevention Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css?v=8.3" />
  <link rel="stylesheet" href="css/device-frame.css?v=8.3" />
  <link rel="stylesheet" href="css/mobile-customer.css?v=8.3" />
  <link rel="stylesheet" href="css/admin-console.css?v=8.3" />

  <!-- Meta Pixel Code (LikeX Official Pixel) -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1107755188608830');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1107755188608830&ev=PageView&noscript=1"/>

</head>
<body>

  <!-- Full Viewport Production Application Container -->
  <div id="app-root">
    <div id="screen-container" class="production-canvas">
      <!-- Dynamically rendered by CustomerApp or AdminApp based on URL route -->
    </div>
  </div>

  <!-- Generic Interactive Modal & Bottom Sheet -->
  <div id="generic-modal-backdrop" class="modal-backdrop">
    <div id="generic-modal-sheet" class="modal-sheet"></div>
  </div>

  <!-- Floating Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Floating VIP Support Desk Widget (Telegram + WhatsApp in 1 Clean Button) -->
  <div class="floating-support-hub" id="floating-support-hub">
    <!-- Support Options Popup Menu -->
    <div class="support-popup-menu" id="support-popup-menu">
      <div class="support-popup-header">
        <div>
          <div class="support-live-dot-wrap">
            <span class="support-live-dot"></span>
            <span>24/7 VIP HELP DESK</span>
          </div>
          <h4 class="support-header-title">How can we help you?</h4>
        </div>
        <button type="button" class="support-popup-close-btn" id="support-popup-close-btn" aria-label="Close">
          ✕
        </button>
      </div>

      <div class="support-popup-body">
        <!-- Telegram VIP Support -->
        <a 
          href="https://t.me/Likex_support" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="support-channel-btn support-btn-tg"
          onclick="if(window.PixelTracker) window.PixelTracker.trackContact('telegram')"
        >
          <div class="support-channel-icon tg-bg">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM16.64 8.8C16.49 10.38 15.84 14.23 15.51 16.01C15.37 16.76 15.09 17.01 14.83 17.04C14.25 17.09 13.81 16.66 13.25 16.29C12.37 15.71 11.87 15.35 11.02 14.79C10.03 14.14 10.67 13.79 11.23 13.2C11.38 13.05 13.93 10.73 13.98 10.52C13.99 10.49 13.99 10.4 13.94 10.35C13.88 10.3 13.8 10.32 13.74 10.34C13.65 10.36 12.27 11.27 9.6 13.07C9.21 13.34 8.85 13.47 8.53 13.46C8.17 13.45 7.49 13.26 6.98 13.09C6.36 12.89 5.86 12.78 5.9 12.44C5.92 12.26 6.17 12.08 6.64 11.89C9.56 10.62 11.51 9.81 12.48 9.4C15.25 8.25 15.82 8.05 16.2 8.05C16.28 8.05 16.47 8.07 16.59 8.17C16.69 8.25 16.72 8.36 16.73 8.44C16.73 8.52 16.74 8.7 16.64 8.8Z" fill="white"/>
            </svg>
          </div>
          <div class="support-channel-details">
            <span class="support-channel-name">Telegram Support</span>
            <span class="support-channel-sub">@Likex_support • Instant 1-on-1</span>
          </div>
          <span class="support-arrow">→</span>
        </a>

        <!-- Email / Gmail VIP Support -->
        <a 
          href="mailto:support@likex.in" 
          class="support-channel-btn support-btn-email"
          onclick="if(window.PixelTracker) window.PixelTracker.trackContact('email')"
        >
          <div class="support-channel-icon email-bg">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <div class="support-channel-details">
            <span class="support-channel-name">Email / Gmail Support</span>
            <span class="support-channel-sub">support@likex.in • Instant Help</span>
          </div>
          <span class="support-arrow">→</span>
        </a>
      </div>

      <div class="support-popup-footer">
        <span>Telegram & Email are monitored 24/7 by LikeX VIP Desk</span>
      </div>
    </div>

    <!-- Main Single Floating Trigger Button -->
    <button 
      type="button" 
      class="support-main-trigger-btn" 
      id="support-main-trigger" 
      aria-expanded="false" 
      aria-label="Open 24/7 VIP Support Menu"
      title="Open 24/7 Support Desk"
    >
      <span class="support-pulse-ring"></span>
      <span class="support-pulse-ring support-pulse-ring-2"></span>
      <span class="support-trigger-icon-wrap">
        <span class="icon-chat-open">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <span class="icon-close-x">✕</span>
      </span>
      <span class="support-tooltip-pill">
        <span>💬 24/7 VIP Support</span>
      </span>
    </button>
  </div>

  <!-- Prevent Stale Cache & Service Worker on Mobile/Desktop -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      }).catch(function(){});
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      }).catch(function(){});
    }
  </script>

  <!-- JavaScript Modules with Cache-Busting Versioning -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=8.5"></script>
  <script src="js/analytics.js?v=8.5"></script>
  <script src="js/jap-catalog.js?v=8.5"></script>
  <script src="js/mock-data.js?v=8.5"></script>
  <script src="js/state-store.js?v=8.5"></script>
  <script src="js/customer-app.js?v=8.5"></script>
  <script src="js/admin-app.js?v=8.5"></script>
  <script src="js/main.js?v=8.5"></script>

</body>
</html>
